{% extends 'base.html' %}
{% block title %}Draft Ordinance — {{ SITE_NAME }}{% endblock %}
{% block page_title %}Draft Ordinance / Resolution{% endblock %}
{% block content %}
<div class="card" style="max-width:780px; margin:0 auto;">
  <div class="card-header"><span class="card-title"><i class="fas fa-scroll"></i> {{ action }} Ordinance / Resolution</span></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="form-group">
          <label class="form-label">Number *</label>
          <input name="number" class="form-control" required placeholder="e.g. 2025-001">
        </div>
        <div class="form-group">
          <label class="form-label">Type *</label>
          <select name="type" class="form-control" required>
            {% for v,l in type_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Title *</label>
        <input name="title" class="form-control" required placeholder="Full title of the ordinance or resolution">
      </div>
      <div class="form-group">
        <label class="form-label">Committee</label>
        <input name="committee" class="form-control" placeholder="Sponsoring committee (optional)">
      </div>
      <div class="form-group">
        <label class="form-label">Content / Body *</label>
        <textarea name="content" class="form-control" rows="10" required placeholder="Full text of the ordinance or resolution..."></textarea>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-gold"><i class="fas fa-scroll"></i> Save Draft</button>
        <a href="{% url 'ordinance_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
