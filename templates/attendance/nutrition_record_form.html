{% extends 'base.html' %}
{% block title %}Record Nutrition Data — {{ SITE_NAME }}{% endblock %}
{% block page_title %}{{ action }} Nutrition Record{% endblock %}
{% block content %}
<div class="card" style="max-width:680px; margin:0 auto;">
  <div class="card-header"><span class="card-title"><i class="fas fa-weight-scale"></i> {{ action }} Growth & Nutrition Data</span></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Resident / Child *</label>
        <select name="citizen" class="form-control" required>
          <option value="">— Select —</option>
          {% for c in citizens %}<option value="{{ c.pk }}">{{ c.full_name }}</option>{% endfor %}
        </select>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;">
        <div class="form-group">
          <label class="form-label">Weight (kg)</label>
          <input name="weight_kg" type="number" step="0.01" class="form-control" placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">Height (cm)</label>
          <input name="height_cm" type="number" step="0.01" class="form-control" placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">MUAC (cm)</label>
          <input name="muac_cm" type="number" step="0.01" class="form-control" placeholder="0.00">
        </div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
        <div class="form-group">
          <label class="form-label">Nutritional Status *</label>
          <select name="nutritional_status" class="form-control" required>
            {% for v,l in status_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Monitoring Date *</label>
          <input name="monitoring_date" type="date" class="form-control" value="{{ today }}" required>
        </div>
      </div>
      <div class="form-group">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" name="is_enrolled_feeding"> Enrolled in Feeding Program
        </label>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="3" placeholder="Additional observations..."></textarea>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-gold"><i class="fas fa-save"></i> Save</button>
        <a href="{% url 'nutrition_record_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
