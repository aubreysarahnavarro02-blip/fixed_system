{% extends 'base.html' %}
{% block title %}Record Transaction — {{ SITE_NAME }}{% endblock %}
{% block page_title %}Record Financial Transaction{% endblock %}
{% block content %}
<div class="card" style="max-width:680px; margin:0 auto;">
  <div class="card-header"><span class="card-title"><i class="fas fa-receipt"></i> Record Transaction</span></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="form-group">
          <label class="form-label">Type *</label>
          <select name="type" class="form-control" required>
            {% for v,l in type_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Fund *</label>
          <select name="fund" class="form-control" required>
            {% for v,l in fund_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Amount (₱) *</label>
          <input name="amount" type="number" step="0.01" class="form-control" required placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">Transaction Date *</label>
          <input name="transaction_date" type="date" class="form-control" value="{{ today }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">OR Number</label>
          <input name="or_number" class="form-control" placeholder="Official Receipt #">
        </div>
        <div class="form-group">
          <label class="form-label">Reference Number</label>
          <input name="reference_number" class="form-control" placeholder="Voucher / Reference #">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Payee / Payor</label>
        <input name="payee" class="form-control" placeholder="Name of payee or payor">
      </div>
      <div class="form-group">
        <label class="form-label">Description *</label>
        <input name="description" class="form-control" required placeholder="Brief description of the transaction">
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="3" placeholder="Additional notes..."></textarea>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-gold"><i class="fas fa-save"></i> Save Record</button>
        <a href="{% url 'financial_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
