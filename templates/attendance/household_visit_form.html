{% extends 'base.html' %}
{% block title %}Log Household Visit — {{ SITE_NAME }}{% endblock %}
{% block page_title %}Log Household Visit{% endblock %}
{% block content %}
<div class="card" style="max-width:680px; margin:0 auto;">
  <div class="card-header"><span class="card-title"><i class="fas fa-house-medical"></i> {{ action }} Household Visit</span></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Resident *</label>
        <select name="citizen" class="form-control" required>
          <option value="">— Select —</option>
          {% for c in citizens %}<option value="{{ c.pk }}">{{ c.full_name }}</option>{% endfor %}
        </select>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="form-group">
          <label class="form-label">Purpose *</label>
          <select name="purpose" class="form-control" required>
            {% for v,l in purpose_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Visit Date *</label>
          <input name="visit_date" type="date" class="form-control" value="{{ today }}" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Findings</label>
        <textarea name="findings" class="form-control" rows="3" placeholder="Observations during the visit..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Recommendations</label>
        <textarea name="recommendations" class="form-control" rows="3" placeholder="Actions recommended..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Next Visit Date</label>
        <input name="next_visit_date" type="date" class="form-control">
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-gold"><i class="fas fa-save"></i> Save Visit</button>
        <a href="{% url 'household_visit_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
