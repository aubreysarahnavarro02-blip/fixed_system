{% extends 'base.html' %}
{% block title %}Add Feeding Program — {{ SITE_NAME }}{% endblock %}
{% block page_title %}{{ action }} Feeding Program{% endblock %}
{% block content %}
<div class="card" style="max-width:660px; margin:0 auto;">
  <div class="card-header"><span class="card-title"><i class="fas fa-bowl-food"></i> {{ action }} Feeding Program</span></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Program Title *</label>
        <input name="title" class="form-control" required placeholder="e.g. August Supplemental Feeding">
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
        <div class="form-group">
          <label class="form-label">Date *</label>
          <input name="date" type="date" class="form-control" value="{{ today }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select name="status" class="form-control">
            {% for v,l in status_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Location *</label>
        <input name="location" class="form-control" required placeholder="Venue / location of feeding">
      </div>
      <div class="form-group">
        <label class="form-label">Number of Beneficiaries</label>
        <input name="beneficiary_count" type="number" class="form-control" value="0">
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Program details..."></textarea>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-gold"><i class="fas fa-save"></i> Save</button>
        <a href="{% url 'feeding_program_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
