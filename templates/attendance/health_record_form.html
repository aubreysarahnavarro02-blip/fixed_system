{% extends 'base.html' %}
{% block title %}New Health Record — {{ SITE_NAME }}{% endblock %}
{% block page_title %}{{ action }} Health Record{% endblock %}
{% block content %}
<div class="card" style="max-width:760px; margin:0 auto;">
  <div class="card-header"><span class="card-title"><i class="fas fa-notes-medical"></i> {{ action }} Health Record</span></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Resident *</label>
        <select name="citizen" class="form-control" required>
          <option value="">— Select Resident —</option>
          {% for c in citizens %}<option value="{{ c.pk }}">{{ c.full_name }}</option>{% endfor %}
        </select>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="form-group">
          <label class="form-label">Condition</label>
          <select name="condition" class="form-control">
            {% for v,l in condition_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Blood Type</label>
          <input name="blood_type" class="form-control" placeholder="e.g. O+">
        </div>
        <div class="form-group">
          <label class="form-label">Last Checkup</label>
          <input name="last_checkup" type="date" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Next Checkup</label>
          <input name="next_checkup" type="date" class="form-control">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Allergies</label>
        <textarea name="allergies" class="form-control" rows="2" placeholder="Known allergies..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Current Medications</label>
        <textarea name="current_medications" class="form-control" rows="2" placeholder="Medications being taken..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Medical Notes</label>
        <textarea name="medical_notes" class="form-control" rows="3" placeholder="Additional medical notes..."></textarea>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-gold"><i class="fas fa-save"></i> Save Record</button>
        <a href="{% url 'health_record_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
