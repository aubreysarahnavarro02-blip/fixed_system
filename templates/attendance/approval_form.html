{% extends 'base.html' %}
{% block title %}Submit Approval Request — {{ SITE_NAME }}{% endblock %}
{% block page_title %}New Approval Request{% endblock %}
{% block content %}
<div class="card" style="max-width:680px; margin:0 auto;">
  <div class="card-header"><span class="card-title"><i class="fas fa-paper-plane"></i> Submit Request for Approval</span></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Request Type *</label>
        <select name="type" class="form-control" required>
          {% for v,l in type_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Title / Subject *</label>
        <input name="title" class="form-control" required placeholder="Brief title of your request">
      </div>
      <div class="form-group">
        <label class="form-label">Description / Justification *</label>
        <textarea name="description" class="form-control" rows="5" required placeholder="Explain your request in detail..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Amount (if financial)</label>
        <input name="amount" type="number" step="0.01" class="form-control" placeholder="e.g. 5000.00">
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-gold"><i class="fas fa-paper-plane"></i> Submit Request</button>
        <a href="{% url 'approval_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
