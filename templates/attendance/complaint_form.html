{% extends 'base.html' %}
{% block title %}File a Case — {{ SITE_NAME }}{% endblock %}
{% block page_title %}File a Complaint / Case{% endblock %}
{% block content %}
<div class="card" style="max-width:700px; margin:0 auto;">
  <div class="card-header"><span class="card-title"><i class="fas fa-gavel"></i> {{ action }} Complaint</span></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Complaint Type *</label>
        <select name="type" class="form-control" required>
          {% for v,l in type_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
        </select>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="form-group">
          <label class="form-label">Complainant Name *</label>
          <input name="complainant_name" class="form-control" required placeholder="Full name of complainant">
        </div>
        <div class="form-group">
          <label class="form-label">Respondent Name *</label>
          <input name="respondent_name" class="form-control" required placeholder="Full name of respondent">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Description / Narration *</label>
        <textarea name="description" class="form-control" rows="6" required placeholder="Detailed account of the complaint..."></textarea>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-gold"><i class="fas fa-gavel"></i> File Case</button>
        <a href="{% url 'complaint_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
