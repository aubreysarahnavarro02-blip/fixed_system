{% extends 'base.html' %}
{% block title %}Add Inventory Item — {{ SITE_NAME }}{% endblock %}
{% block page_title %}{{ action }} Inventory Item{% endblock %}

{% block content %}
<div class="card" style="max-width:660px; margin:0 auto;">
  <div class="card-header">
    <span class="card-title"><i class="fas fa-boxes-stacked"></i> {{ action }} Inventory Item</span>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Item Name *</label>
        <input name="name" class="form-control" required placeholder="e.g. Bond Paper, Cleaning Mop, Printer Ink">
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select name="category" class="form-control" required>
            {% for v,l in category_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Location / Storage</label>
          <input name="location" class="form-control" placeholder="e.g. Supply Room, Cabinet A">
        </div>
        <div class="form-group">
          <label class="form-label">Quantity *</label>
          <input name="quantity" type="number" min="0" class="form-control" value="0" required>
        </div>
        <div class="form-group">
          <label class="form-label">Unit of Measurement</label>
          <input name="unit" class="form-control" value="piece" placeholder="piece, pack, ream, box...">
        </div>
        <div class="form-group">
          <label class="form-label">Minimum Stock Level</label>
          <input name="minimum_stock" type="number" min="0" class="form-control" value="5">
          <small class="text-muted">Alert when stock falls below this number.</small>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="3" placeholder="Additional notes or specifications..."></textarea>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-gold"><i class="fas fa-save"></i> Save Item</button>
        <a href="{% url 'inventory_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
