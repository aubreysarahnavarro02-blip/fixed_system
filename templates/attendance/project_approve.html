{% extends 'base.html' %}
{% block title %}Update Project — {{ SITE_NAME }}{% endblock %}
{% block page_title %}Update Project Status{% endblock %}
{% block content %}
<div class="card" style="max-width:660px; margin:0 auto;">
  <div class="card-header"><span class="card-title">{{ project.title }}</span></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Update Status</label>
        <select name="status" class="form-control" required>
          {% for v,l in status_choices %}<option value="{{ v }}" {% if project.status == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Progress (0–100%)</label>
        <input name="progress_percent" type="number" min="0" max="100" class="form-control" value="{{ project.progress_percent }}">
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn btn-gold"><i class="fas fa-save"></i> Save Changes</button>
        <a href="{% url 'project_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
